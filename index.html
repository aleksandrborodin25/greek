<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ελληνικά A1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --fb-bg:#ffffff; --fb-text:#15171a; --fb-hint:#858a93; --fb-btn:#2f7cf6; --fb-btnt:#ffffff; --fb-card:#f1f3f6;
  --bg:var(--tg-theme-bg-color,var(--fb-bg));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --btn:var(--tg-theme-button-color,var(--fb-btn));
  --btnt:var(--tg-theme-button-text-color,var(--fb-btnt));
  --card:var(--tg-theme-secondary-bg-color,var(--fb-card));
  --ok:#22a55b; --bad:#e5484d; --okbg:rgba(34,165,91,.14); --badbg:rgba(229,72,77,.13);
  --fire:#ff8a1f; --line:rgba(127,127,127,.18);
}
@media (prefers-color-scheme: dark){
  :root{--fb-bg:#16181c; --fb-text:#eceef1; --fb-hint:#8d939c; --fb-btn:#4a8ef8; --fb-card:#22252b;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0 14px;letter-spacing:-.01em}
h2{font-size:17px;margin:22px 0 10px}
.hint{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--btn);border-radius:8px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--btn);color:var(--btnt);font-weight:600;text-align:center}
.btn.sec{background:var(--card);color:var(--text)}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats3 .card{margin:0;text-align:center;padding:12px 6px}
.stats3 .lbl{font-size:12px;color:var(--hint)}
.quest{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .ic{font-size:20px;width:26px;text-align:center}
.quest .rw{font-size:13px;color:var(--hint);white-space:nowrap}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.topic .em{font-size:24px;width:32px;text-align:center}
.topic .t{font-weight:600}
.topic .bar{margin-top:6px;height:6px}
.pct{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);margin:18px 4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:8px 0 10px;font-size:11px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--btn);font-weight:600}
.back{color:var(--btn);padding:4px 0;margin-bottom:6px}
/* слова */
.w{padding:10px 0;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .el{font-weight:600;font-size:17px}
.w .tbl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-size:14px;margin-top:6px;color:var(--hint)}
.w .tbl b{color:var(--text);font-weight:500}
.say{font-size:18px;padding:2px 6px;border-radius:8px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--hint);margin-left:6px;vertical-align:2px}
/* урок */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.lhead .x{font-size:22px;color:var(--hint);padding:4px 6px}
.lhead .bar{flex:1;height:12px}
.kind{font-size:13px;color:var(--hint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.prompt{font-size:20px;line-height:1.35;margin-bottom:6px}
.prompt .gr{font-size:30px;font-weight:700;display:block;margin:10px 0 2px}
.prompt .sub{font-size:15px;color:var(--hint);display:block}
.opts{display:grid;gap:10px;margin-top:20px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{padding:15px 14px;border-radius:14px;background:var(--card);border:2px solid transparent;text-align:center;font-size:17px;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--btn)}
.opt.done{opacity:.35;border-color:var(--ok);background:var(--okbg)}
.opt.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.match .col{display:grid;gap:10px}
.match .opt{min-height:58px;font-size:15px;padding:10px 8px;display:flex;align-items:center;justify-content:center}
.answer{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);margin-top:20px;text-align:center;outline:none}
.answer:focus{border-color:var(--btn)}
.kb{margin-top:14px;display:grid;gap:6px;user-select:none}
.kb .r{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:40px;height:44px;border-radius:8px;background:var(--card);font-size:19px;box-shadow:0 1px 0 var(--line)}
.kb button.wide{max-width:none;flex:3}
.kb button.fn{max-width:58px;flex:1.4;font-size:16px}
.kb button.acc.on{background:var(--btn);color:var(--btnt)}
.links{display:flex;justify-content:space-between;margin-top:12px}
.links button{color:var(--btn);font-size:14px;padding:6px 2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .in{max-width:560px;margin:0 auto}
.sheet.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.sheet.bad{background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.sheet .h{font-weight:700;font-size:19px;margin-bottom:4px}
.sheet.ok .h{color:var(--ok)} .sheet.bad .h{color:var(--bad)}
.sheet .d{font-size:15px;margin-bottom:12px}
.sheet .d i{color:var(--hint);font-style:normal}
.sheet.ok .btn{background:var(--ok);color:#fff} .sheet.bad .btn{background:var(--bad);color:#fff}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.newcard{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.newcard .el{font-size:24px;font-weight:700}
.newcard .forms{font-size:14px;color:var(--hint);margin-top:4px}
.center{text-align:center}
.trophy{font-size:64px;margin:20px 0 4px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;animation:fade 2.8s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-8px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:12px;color:var(--hint)}
.week .c{height:34px;border-radius:9px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:4px}
.week .c.part{background:color-mix(in srgb,var(--fire) 30%,transparent)}
.week .c.full{background:var(--fire);color:#fff}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:15px}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.setrow{margin-bottom:16px}
.setrow .lb{margin-bottom:8px;font-weight:500}
.switch{display:flex;justify-content:space-between;align-items:center}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s}
.tog::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--ok)} .tog.on::after{left:22px}
.danger{color:var(--bad)}
</style>
</head>

      (/^(ο|η|το) /.test(w.el) ? '<span class="sub">артикль можно не писать</span>' : '')}),
  conj(w, typed = false) {
    const i = Math.floor(rnd() * 6), p = pron(i), correct = w.forms[i];
    const prompt = `${typed ? 'Напиши форму глагола' : 'Выбери форму глагола'}<span class="gr">${esc(p)} ___</span><span class="sub">${esc(w.el)} — ${esc(w.ru)}</span>`;
    const explain = 'Спряжение: ' + formsLine(w);
    if (typed) return {type: 'text', kind: 'conj_type', word: w.id, prompt, explain,
      answers: correct.concat(correct.map(f => p + ' ' + f)), correctText: `${p} ${correct[0]}`};
    const wrong = [];
    for (const j of shuffle([0, 1, 2, 3, 4, 5])) { const f = w.forms[j][0]; if (j !== i && !correct.includes(f) && !wrong.includes(f)) wrong.push(f); }
    return choice('conj', w, prompt, correct[0], wrong.slice(0, 3), explain, 2);
  },
  conj_type: w => EX.conj(w, true),
  person(w) {
    const canon = w.forms.map(f => f[0]);
    const i = pick([0, 1, 2, 3, 4, 5].filter(i => canon.filter(x => x === canon[i]).length === 1));
    return {type: 'choice', kind: 'person', word: w.id, cols: 2,
      prompt: `Чья это форма?<span class="gr">${esc(canon[i])}</span><span class="sub">${esc(w.el)} — ${esc(w.ru)}</span>`,
      options: PERSONS.slice(), answer: i, correctText: PERSONS[i], explain: 'Спряжение: ' + formsLine(w)};
  },
  group: w => ({type: 'choice', kind: 'group', word: w.id, cols: 3,
    prompt: `К какой группе спряжения относится глагол?<span class="gr">${esc(w.el)}</span><span class="sub">${esc(w.ru)}</span>`,
    options: ['A', 'B1', 'B2'], answer: ['A', 'B1', 'B2'].indexOf(w.group), correctText: w.group, explain: GROUP_INFO[w.group]}),
};
const KIND_LABEL = {tf:'Верно или нет', el_ru:'Перевод', ru_el:'Перевод', type:'Напиши слово', conj:'Спряжение',
  conj_type:'Спряжение', person:'Спряжение', group:'Группа глагола', match:'Соедини пары'};
function candidates(w, box, typing) {
  const isVerb = !!w.forms; let c;
  if (box <= 0) c = ['tf', 'el_ru', 'el_ru'];
  else if (box === 1) c = ['el_ru', 'ru_el', 'ru_el', 'tf'];
  else c = ['ru_el', 'el_ru'].concat(typing ? ['type', 'type'] : ['ru_el']);
  if (isVerb) {
    c = c.concat(box >= 1 ? ['conj', 'conj', 'conj'] : ['conj']);
    if (box >= 2) c = c.concat(['person'], typing ? ['conj_type', 'conj_type'] : ['conj']);
    if (['A', 'B1', 'B2'].includes(w.group)) c.push('group');
  }
  return c;
}
function buildLesson(words, typing) {
  const box = {}; words.forEach(w => box[w.id] = P(w) ? P(w)[0] : 0);
  const useMatch = words.length >= 4, need = LESSON_LEN - (useMatch ? 1 : 0);
  const used = {}; words.forEach(w => used[w.id] = new Set());
  let singles = []; const order = shuffle(words);
  while (singles.length < need) for (const w of order) {
    if (singles.length >= need) break;
    const c = candidates(w, box[w.id], typing), fresh = c.filter(k => !used[w.id].has(k));
    const k = pick(fresh.length ? fresh : c); used[w.id].add(k); singles.push(EX[k](w));
  }
  singles = shuffle(singles).sort((a, b) => (['tf', 'el_ru'].includes(a.kind) ? 0 : 1) - (['tf', 'el_ru'].includes(b.kind) ? 0 : 1));
  for (let i = 1; i < singles.length; i++) if (singles[i].word === singles[i - 1].word)
    for (let j = i + 1; j < singles.length; j++) if (singles[j].word !== singles[i - 1].word) { [singles[i], singles[j]] = [singles[j], singles[i]]; break; }
  if (useMatch) {
    const chosen = [];
    for (const w of words.slice().sort((a, b) => box[a.id] - box[b.id] || rnd() - .5)) {
      if (!chosen.some(c => c.ru === w.ru || c.el === w.el)) chosen.push(w);
      if (chosen.length === 4) break;
    }
    if (chosen.length === 4) singles.splice(Math.min(3, singles.length), 0,
      {type: 'match', kind: 'match', words: chosen.map(w => w.id), left: shuffle(chosen.map(w => w.id)), right: shuffle(chosen.map(w => w.id)), done: [], errors: [], sel: null});
  }
  return singles;
}

function say(text) {

function topicStats(key) {
  const ws = TOPICS[key].words, n = ws.length; let seen = 0, learned = 0, boxSum = 0, due = 0; const t = today();
  for (const w of ws) { const p = P(w); if (p) { seen++; boxSum += p[0]; if (p[0] >= LEARNED) learned++; if (p[1] <= t) due++; } }
  return {n, seen, learned, mastery: boxSum / (n * MAX_BOX), due};
}

    <div class="r"><button class="wide" data-k=" ">пробел</button></div></div>`;
}
const ACC = {α:'ά', ε:'έ', η:'ή', ι:'ί', ο:'ό', υ:'ύ', ω:'ώ', ά:'α', έ:'ε', ή:'η', ί:'ι', ό:'ο', ύ:'υ', ώ:'ω'};
function bindText(ex) {
  const inp = document.getElementById('ans'), chk = document.getElementById('chk');
  const upd = () => { chk.disabled = !inp.value.trim(); };
  inp.addEventListener('input', upd);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) submitText(ex, inp.value); });
  if (!S.meta.set.kb) setTimeout(() => inp.focus(), 50);
  let pendingAcc = false;
  const kb = document.getElementById('kb');
  if (kb) kb.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; haptic.tap();
    const k = b.dataset.k, accBtn = kb.querySelector('.acc');
    if (k === '⌫') inp.value = inp.value.slice(0, -1);
    else if (k === '´') {
      const last = inp.value.slice(-1);
      if (last && ACC[last]) inp.value = inp.value.slice(0, -1) + ACC[last];
      else { pendingAcc = !pendingAcc; accBtn.classList.toggle('on', pendingAcc); }
    } else {
      let c = k; if (pendingAcc && ACC[c] && 'αεηιουω'.includes(c)) c = ACC[c];
      pendingAcc = false; accBtn.classList.remove('on'); inp.value += c;
    }
    upd();
  });
  document.getElementById('kbt').onclick = () => { S.meta.set.kb = !S.meta.set.kb; markDirty('meta'); const v = inp.value; renderQ(); const i2 = document.getElementById('ans'); i2.value = v; i2.dispatchEvent(new Event('input')); };
  chk.onclick = () => submitText(ex, inp.value);
  document.getElementById('idk').onclick = () => { if (!L.answered) finishAnswer(ex, false, false, null); };
}
function submitText(ex, val) {
  if (L.answered) return;
  if (!/[Ͱ-Ͽἀ-῿]/.test(val)) { toast('Нужно написать греческими буквами 🙂'); return; }
  const [ok, accent] = checkText(val, ex.answers);
  document.getElementById('ans').style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
  finishAnswer(ex, ok, accent, ok ? null : val);
}
function answerChoice(ex, i) {
  if (L.answered) return;
  const ok = i === ex.answer;
  const btns = $app.querySelectorAll('.opts .opt');
  btns[ex.answer].classList.add('ok'); if (!ok) btns[i].classList.add('bad');
  finishAnswer(ex, ok, false, ok ? null : ex.options[i]);
}
function register(wid, ok, kind, inc = {}) {
  recordAnswer(WORDS[wid], ok);
  L.total++; (L.wordOk[wid] = L.wordOk[wid] || []).push(ok);
  let xp = 0;
  if (ok) { L.correct++; xp = XP[kind]; inc.correct = (inc.correct || 0) + 1; }
  L.xp += award(xp, inc);
}
function finishAnswer(ex, ok, accent, given) {
  L.answered = true;
  const inc = {};
  if (ok && ['conj', 'conj_type', 'person'].includes(ex.kind)) inc.conj = 1;
  if (ok && ['type', 'conj_type'].includes(ex.kind)) inc.typed = 1;
  register(ex.word, ok, ex.kind, inc);
  const w = WORDS[ex.word];
  ok ? haptic.ok() : haptic.bad();
  let d = '';
  if (ok) {
    if (accent) d += `⚠️ Проверь ударение: <b>${esc(ex.correctText)}</b><br>`;
    if (['ru_el', 'type', 'tf', 'el_ru'].includes(ex.kind)) d += `<b>${esc(w.el)}</b> — ${esc(w.ru)}`;
    if (ex.kind === 'group') d += `<i>${esc(ex.explain)}</i>`;
  } else {
    d += `Правильно: <b>${esc(ex.correctText)}</b>`;
    if (given) d += `<br><i>Твой ответ: ${esc(given)}</i>`;
    if (ex.explain && ex.kind !== 'tf') d += `<br><i>${esc(ex.explain)}</i>`;
    else if (ex.kind === 'tf') d += `<br><i>${esc(ex.explain)}</i>`;
  }
  showSheet(ok, d, w.el);
}
function showSheet(ok, d, sayText) {
  const s = document.createElement('div');
  s.className = 'sheet ' + (ok ? 'ok' : 'bad');
  s.innerHTML = `<div class="in"><div class="row"><div class="h grow">${ok ? pick(['Верно!', 'Отлично!', 'Μπράβο!', 'Так держать!']) : 'Не совсем'}</div>${sayText ? sayBtn(sayText) : ''}</div>
    <div class="d">${d}</div><button class="btn" id="next">Дальше</button></div>`;
  document.body.appendChild(s);
  const next = () => { document.removeEventListener('keydown', onKey); s.remove(); L.idx++; renderQ(); };
  const onKey = e => { if (e.key === 'Enter') { e.preventDefault(); next(); } };
  setTimeout(() => document.addEventListener('keydown', onKey), 50);
  s.querySelector('#next').onclick = next;
}
function bindMatch(ex) {
  const btn = (s, i) => $app.querySelector(`.match [data-s="${s}"][data-i="${i}"]`);
  $app.querySelectorAll('.match .opt').forEach(b => b.onclick = () => {
    if (L.answered || b.classList.contains('done')) return;
    const s = b.dataset.s, i = +b.dataset.i;
    haptic.tap();
    if (!ex.sel || ex.sel[0] === s) {
      if (ex.sel) btn(ex.sel[0], ex.sel[1]).classList.remove('sel');
      ex.sel = [s, i]; b.classList.add('sel'); return;
    }
    const li = s === 'L' ? i : ex.sel[1], ri = s === 'R' ? i : ex.sel[1];
    const lb = btn('L', li), rb = btn('R', ri);
    lb.classList.remove('sel'); rb.classList.remove('sel'); ex.sel = null;
    const lw = ex.left[li], rw = ex.right[ri];
    if (lw === rw) {
      ex.done.push(lw); lb.classList.add('done'); rb.classList.add('done'); haptic.ok();
      if (ex.done.length === ex.words.length) {
        L.answered = true; let clean = 0;
        for (const wid of ex.words) { const ok = !ex.errors.includes(wid); clean += ok; register(wid, ok, 'match_pair'); }
        L.xp += award(0, {match: 1});
        const d = ex.words.map(id => `<b>${esc(WORDS[id].el)}</b> — ${esc(WORDS[id].ru)}`).join('<br>');
        setTimeout(() => showSheet(!ex.errors.length, (ex.errors.length ? `Ошибок: ${ex.errors.length}<br>` : '') + d, null), 250);
      }
    } else {
      haptic.bad();
      for (const w of [lw, rw]) if (!ex.errors.includes(w)) ex.errors.push(w);
      [lb, rb].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
    }
  });
}
function renderSummary() {
  const perfect = L.total >= 5 && L.correct === L.total;
  const learnedNew = [...L.newIds].filter(id => (L.wordOk[id] || []).some(Boolean)).length;
  const inc = {lessons: 1}; if (perfect) inc.perfect = 1; if (learnedNew) inc.new = learnedNew;
  L.xp += award(perfect ? 20 : 0, inc);
  flush();
  const pct = L.total ? Math.round(100 * L.correct / L.total) : 0;
  const mistakes = Object.keys(L.wordOk).filter(id => !L.wordOk[id].every(Boolean));
  const goal = S.meta.set.goal, xp = dayXp();
  if (tg && tg.BackButton) tg.BackButton.hide();
  const topic = L.topic;
  $app.innerHTML = `<div class="center"><div class="trophy">${perfect ? '🏆' : pct >= 70 ? '🎉' : '💪'}</div>
    <h1>${perfect ? 'Без единой ошибки!' : pct >= 70 ? 'Урок пройден!' : 'Хорошая тренировка!'}</h1></div>
    <div class="stats3">
      <div class="card"><div class="big">${pct}%</div><div class="lbl">точность</div></div>
      <div class="card"><div class="big">+${L.xp}</div><div class="lbl">XP</div></div>
      <div class="card"><div class="big">🔥${effStreak()}</div><div class="lbl">серия</div></div>
    </div>
    <div class="card"><div class="row" style="margin-bottom:8px"><div class="grow">Цель дня</div><div class="pct">${Math.min(xp, goal)}/${goal}</div></div>${barHtml(xp / goal, xp >= goal ? 'ok' : '')}</div>
    ${learnedNew ? `<div class="card">🆕 Новых слов: <b>${learnedNew}</b></div>` : ''}
    ${mistakes.length ? `<div class="card"><b>Повтори</b>${mistakes.slice(0, 8).map(id => `<div class="w"><div class="row"><div class="grow"><span class="el">${esc(WORDS[id].el)}</span><div class="hint">${esc(WORDS[id].ru)}</div></div>${sayBtn(WORDS[id].el)}</div></div>`).join('')}</div>` : ''}
    <button class="btn" id="again">▶️ Ещё урок</button>
    <button class="btn sec" id="home">Готово</button>`;
  L = null;
  document.getElementById('again').onclick = () => startLesson(topic);
  document.getElementById('home').onclick = () => go(topic ? 'topic' : 'home', topic);
}

// ============================================================ старт
loadAll().then(() => go('home'));
</script>
